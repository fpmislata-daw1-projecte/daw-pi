site_name: "Projecte DAW1"
site_description: "Projecte intermodular de 1r de Desenvolupament d'Aplicacions Web (DAW1)"
site_author: "Equip educatiu DAW1 del CIPFP Mislata"
site_url: https://fpmislata-daw1-projecte.github.io/projecte-daw1/
dev_addr: 127.0.0.1:4567

repo_name: projecte-daw1
repo_url: https://github.com/fpmislata-daw1-projecte/projecte-daw1
copyright: CC BY-NC-SA 4.0 (Reconeixement - NoComercial - CompartirIgual) 🅭 Equip educatiu DAW1 del CIPFP Mislata

extra:
  social:
    - icon: octicons/organization-24
      link: https://www.fpmislata.com/wordpress/
      name: CIPFP Mislata
    - icon: fontawesome/brands/github
      link: https://github.com/projecte-daw1
      name: projecte-daw1 a GitHub

extra_css:
  - assets/styles/styles.css

draft_docs: |
  *_unpublished.md
  *_draft.md

exclude_docs: |
  _*

theme:
  name: material-joapuiib
  icon:
    logo: material/web
  favicon: material/web

  # Palette toggle for light mode
  palette:
    - media: "(prefers-color-scheme: light)"
      primary: 'teal'
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Canvia a mode fosc

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: 'teal'
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Canvia a mode clar

  features:
    - announce.dismiss
    - content.code.copy
    - content.code.annotate
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - toc.follow
    - search.share
    - search.suggest

plugins:
  - materialx/search
  - awesome-nav
  - alias:
      use_anchor_titles: true
      use_page_icon: true
  - glightbox
  - materialx/social:
      enabled: !ENV [CI, false]
  - materialx/tags
  - i18n:
      languages:
        - locale: ca
          default: true
          name: Valencià
          admonition_translations:
            info: Informació
            note: Nota
            abstract: Resum
            tip: Consell
            success: Èxit
            question: Pregunta
            warning: Advertència
            failure: Error
            danger: Perill
            example: Exemple
            quote: Cita
            docs: Documentació
            solution: Solució
            important: Important
            notice: Fixa't
            prep: Preparació
            recommend: Recomanació
  - git-revision-date-localized # Després de i18n o falla
  - git-committers:
      enabled: !ENV [CI, false]
      repository: fpmislata-daw1-projecte/projecte-daw1
      branch: main
      exclude_committers:
        - web-flow

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - markdown_grid_tables
  - sane_lists
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.blocks.html
  - pymdownx.blocks.caption:
      auto: true
      types:
        - caption
        - name: attribution
          classes: attribution spell-ignore
        - name: figure-caption
          prefix: 'Figura {}.'
        - name: shadow-figure-caption
          prefix: 'Figura {}.'
          classes: 'shadow'
        - name: table-caption
          prefix: 'Taula {}.'
  - inline_blocks
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material_joapuiib.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.fancylists:
      inject_class: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.saneheaders
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - rubric
  - toc:
      permalink: true
  - pymdown_multimd_table:
      rowspan: true
